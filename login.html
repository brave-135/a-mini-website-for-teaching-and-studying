<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - My Space</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC',sans-serif;background:#0a0e17;color:#e0e0e0;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.login-box{background:#131b30;border:1px solid #1e2d4a;border-radius:16px;padding:40px;width:360px}
.login-box h1{text-align:center;font-size:24px;margin-bottom:24px;background:linear-gradient(90deg,#00d4ff,#7b61ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box label{color:#5a6a8a;font-size:13px;display:block;margin-bottom:4px;margin-top:16px}
.login-box input{width:100%;padding:10px 14px;background:#0a0e17;border:1px solid #1e2d4a;border-radius:8px;color:#e0e0e0;font-size:15px;outline:none}
.login-box input:focus{border-color:#00d4ff}
.login-box button{width:100%;margin-top:24px;padding:12px;background:linear-gradient(135deg,#00d4ff,#7b61ff);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.login-box button:hover{opacity:.9}
.login-box .error{color:#ff6b6b;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
.login-box .hint{color:#4a5a7a;font-size:12px;text-align:center;margin-top:12px}
.back{color:#5a6a8a;font-size:13px;margin-top:20px}
.back a{color:#00d4ff;text-decoration:none}
</style>
</head>
<body>
<div class="login-box">
    <h1>Login</h1>
    <label>Username</label>
    <input type="text" id="userInput" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <label>Password</label>
    <input type="password" id="passInput" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Login</button>
    <div class="error" id="errorMsg"></div>
    <div class="hint">Default: admin / admin</div>
</div>
<div class="back">No account? <a href="/register.html">Register</a> &nbsp;|&nbsp; <a href="/">Home</a></div>
<script>
async function doLogin(){
    const u=document.getElementById('userInput').value.trim()
    const p=document.getElementById('passInput').value.trim()
    if(!u||!p){document.getElementById('errorMsg').textContent='Please fill in all fields';return}
    document.getElementById('errorMsg').textContent='Logging in...'
    try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})})
        const d=await r.json()
        if(d.ok){
            window.location.href='/blog.html'
        }else{
            document.getElementById('errorMsg').textContent=d.error||'Login failed'
        }
    }catch(e){document.getElementById('errorMsg').textContent='Network error'}
}
</script>
</body>
</html>
